  orientation_controller:
    force_normal_signal: "u = F / ||F||"
    force_normal_dimension: 3
    skew_matrix: "S = skew(u)"
    desired_rotation_equation: "Rd = I + sin(u)*S + (1 - cos(u))*S^2"
    desired_rotation_note: "Ambiguous in extracted paper text: u is defined as a 3D force-normal vector, but Eq. (10) applies scalar trigonometric functions to u."
    quaternion_error: "e_qua = Qd^{-1} * Q"
    angular_velocity_command: "xdot_o = xdot_od + ko*e_o"
    unknown_surface_assumption: "Paper sets xdot_od = 0 for the slow unknown-surface orientation process, so xdot_o = ko*e_o with an angular velocity limit."
  force_motion_controller:
    impedance_equation: "Md*(xddot_pd - xddot_p) + Bd*(xdot_pd - xdot_p) + Kd*(xpd - xp) = Fd - F"
    improved_impedance_assumption: "Kd = 0 with integral force-error term"
    improved_impedance_equation: "xddot_p = (ef + kf*integral(ef dt) - Bd*xdot_p) / Md"
    velocity_command: "xdot_p(t) = PhiO*(xdot_pd + kp*ep) + PhiO_bar*(xdot_p(t-T) + xddot_p(t)*T)"
  optimization:
    objective: "minimize qdot^T*qdot/2"
    equality_constraint: "xdot_c = [xdot_p; xdot_o] = J(theta)*qdot"
    boundary_method: "escape-velocity joint position and velocity bounds"
    inner_loop: "finite-time recurrent neural network, Eq. (23)"
