readiness_checks:
- name: mounted_stack_tcp_contact_point
  status: insufficient_design_only
  has_measured_record: false
  constrains_v85_margin: false
  evidence:
  - EOAT design candidate contact point = 85.0 mm from design flange face.
  - Current UR TCP readback = [0.0, 0.0, 0.12254, 0.0, 0.0, 0.0]; hardware note says
    this is temporary and not validated for contact.
  - OnRobot FT setup photo evidence has UR default TCP selected, not sensor flange
    TCP.
  blockers:
  - No measured flange-to-contact point for the assembled UR10e + OnRobot + EOAT stack.
  - No measured uncertainty budget comparable to the v85 14.96 um equivalent margin.
  required_next:
  - Measure mounted flange/sensor/tool stack contact point in the robot TCP convention.
  - Record measurement method, repeatability, datum, sign, and uncertainty.
- name: contact_patch_convention
  status: insufficient_design_assumption
  has_measured_record: false
  constrains_v85_margin: false
  evidence:
  - EOAT verification treats the KSM-8N dimensions as assumptions to confirm.
  - Printable assembly excludes the purchased KSM placeholder.
  - Simulation uses a 45 mm sphere behind the TCP site as a contact-point convention
    variant.
  blockers:
  - No mounted KSM-8N seating verification tied to the actual contact patch.
  - No measurement of whether the physical contact datum is ball top, sphere center,
    or another loaded patch.
  required_next:
  - Verify KSM seating, protrusion, loaded contact patch, and centerline alignment
    after assembly.
  - Decide and document whether the gate uses contact point, ball center, or another
    physical datum.
- name: plane_contact_normal
  status: insufficient_analytic_simulation_only
  has_measured_record: false
  constrains_v85_margin: false
  evidence:
  - MuJoCo config uses a single analytic plane tilted 10 deg about y.
  - Expected normal is taken from config, not a measured robot-base-frame plane normal.
  blockers:
  - No measured plane normal in the robot base frame.
  - No normal-angle uncertainty budget comparable to the v85 0.03246 deg required
    correction.
  required_next:
  - Measure plane pose/normal in robot base frame with a repeatable read-only or fixture-based
    method.
  - Record normal uncertainty and compare directly to 0.03246 deg.
- name: force_source_frame
  status: unresolved_conflict
  has_measured_record: true
  constrains_v85_margin: false
  evidence:
  - Direct TCP DAQ stopped-state Fz mean = -32.7114 N.
  - Program-running direct TCP DAQ Fz mean = -32.6699 N.
  - RTDE actual_TCP_force Fz was observed around 0.3 N.
  - Hardware note says direct TCP DAQ and PolyScope/RTDE force values use different
    zero/reference/compensation until proven otherwise.
  blockers:
  - Force source and frame are not reconciled.
  - Direct TCP DAQ READFT cannot be used as control truth from the current evidence.
  required_next:
  - Map PolyScope OnRobot variables to RTDE output registers in a no-motion program.
  - Compare URCap variables, RTDE, and direct TCP DAQ under the same zero/frame state.
- name: orientation_gate_semantics
  status: not_accepted
  has_measured_record: false
  constrains_v85_margin: false
  evidence:
  - V85 shows scoped recovery at larger gates but marks accepted_replacement_gate
    false.
  - V69 found full-rotation and force-normal-only errors numerically equal for the
    audited terminal cases.
  blockers:
  - No accepted definition replacing the current 0.119 rad diagnostic gate.
  - No calibrated normal/contact geometry supporting a relaxed gate.
  required_next:
  - Define whether the diagnostic gate is force-normal-only or full-frame rotation.
  - Tie any replacement gate to measured geometry and normal uncertainty.
measurement_checklist:
- Measure mounted stack TCP/contact point from a named flange/sensor/tool datum.
- Measure or verify the physical KSM-8N contact datum and loaded contact patch convention.
- Measure the contact plane normal in the robot base frame and record angle uncertainty.
- Reconcile OnRobot URCap variables, UR RTDE, and direct TCP DAQ force frames/zeroing
  without motion.
- Define the diagnostic orientation gate semantics and uncertainty budget before relaxing
  any gate.
- Only after the read-only evidence is accepted, update simulation geometry or gate
  definitions in a separate branch.
v86_objective_answers:
- question: 1. Is there a measured mounted-stack TCP/contact point?
  answer: No. Existing records provide a design 85.0 mm candidate and a temporary
    UR TCP readback, not a measured mounted-stack contact point.
- question: 2. Is the 85.0 mm EOAT datum a surface, sphere center, or design-reference
    point?
  answer: It is a design contact-point candidate from CAD metadata. The actual mounted
    KSM contact patch/ball datum is not verified.
- question: 3. Is the plane/contact normal measured in robot base frame?
  answer: No. The current normal is an analytic MuJoCo 10 deg tilted-plane assumption.
- question: 4. Is the force source/frame reconciled?
  answer: No. Existing records show a persistent direct TCP DAQ versus RTDE/PolyScope
    force-value disagreement around 32 N.
- question: 5. Is any existing uncertainty small enough for the v85 correction?
  answer: No accepted measurement uncertainty exists for the 0.03246 deg or 14.96
    um v85 correction.
- question: 6. What measurement/SOP is required before a gate relaxation or hardware
    claim?
  answer: Mounted TCP/contact measurement, contact patch convention verification,
    plane-normal measurement, force-source reconciliation, and accepted orientation-gate
    semantics.
- question: 7. Does this support more Stage B qdot tuning?
  answer: No. The missing evidence is geometry/normal/force-frame readiness, and v85
    already showed the hard row has 0.0 qdot saturation.
